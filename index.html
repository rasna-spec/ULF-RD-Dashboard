<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Universal Limbs — R&D Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#181a1c;
  --ink:#f6f3fa;
  --muted:rgba(246,243,250,.62);
  --quiet:rgba(246,243,250,.38);
  --line:rgba(246,243,250,.16);
  --line-strong:rgba(246,243,250,.28);
  --panel:rgba(246,243,250,.035);
  --panel-strong:rgba(246,243,250,.075);
  --shadow:rgba(0,0,0,.45);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:"Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 50% 45%, rgba(246,243,250,.08) 0%, rgba(246,243,250,.025) 22%, transparent 52%),
    linear-gradient(180deg, #181a1c 0%, #101214 100%);
}

button,a{font:inherit;color:inherit}

.dashboard{
  width:min(1500px,100vw);
  min-height:900px;
  margin:0 auto;
  position:relative;
  padding:38px 38px 34px;
  overflow:hidden;
}

.dashboard:before{
  content:"";
  position:absolute;
  inset:auto -10% 0 -10%;
  height:42%;
  background-image:
    linear-gradient(rgba(246,243,250,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(246,243,250,.045) 1px, transparent 1px);
  background-size:48px 48px;
  transform:perspective(680px) rotateX(62deg) translateY(60px);
  transform-origin:bottom center;
  opacity:.42;
  pointer-events:none;
}

.topbar{
  position:relative;
  z-index:5;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
  gap:24px;
  min-height:44px;
}

.brand{
  display:flex;
  align-items:center;
  gap:34px;
  font-size:18px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.brand .divider{
  width:1px;
  height:22px;
  background:var(--line);
}

.brand .sub{
  font-size:15px;
  color:var(--muted);
  text-transform:lowercase;
  letter-spacing:.08em;
}

.top-center,
.top-year{
  font-size:18px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:lowercase;
}

.top-year{
  justify-self:end;
}

.layout{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:310px minmax(430px,1fr) 325px;
  gap:42px;
  min-height:720px;
  margin-top:140px;
}

.left-panel{
  border-right:1px solid var(--line);
  padding:42px 0 42px 24px;
}

.panel-title{
  font-size:16px;
  letter-spacing:.08em;
  text-transform:lowercase;
  margin:0 0 28px;
}

.side-nav{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.nav-item{
  appearance:none;
  border:0;
  background:transparent;
  min-height:74px;
  display:grid;
  grid-template-columns:48px 1fr;
  align-items:center;
  gap:22px;
  text-align:left;
  color:var(--ink);
  cursor:pointer;
  padding:0 20px;
  border-left:2px solid transparent;
  border-radius:0;
  opacity:.92;
}

.nav-item.active{
  border-left-color:var(--ink);
  background:linear-gradient(90deg, rgba(246,243,250,.09), rgba(246,243,250,.02) 70%, transparent);
}

.nav-icon{
  width:34px;
  height:34px;
  color:var(--ink);
  display:grid;
  place-items:center;
}

.nav-icon svg{
  width:34px;
  height:34px;
  stroke:currentColor;
  stroke-width:1.5;
  fill:none;
}

.nav-label{
  font-size:17px;
  letter-spacing:.08em;
  text-transform:lowercase;
}

.center-stage{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:650px;
}

.render-frame{
  position:relative;
  width:min(580px,100%);
  aspect-ratio:3/4;
  display:grid;
  place-items:center;
  filter:drop-shadow(0 30px 34px rgba(0,0,0,.45));
}

.render-frame:before{
  content:"";
  position:absolute;
  left:50%;
  bottom:18px;
  width:86%;
  height:25%;
  transform:translateX(-50%);
  border:1px solid rgba(246,243,250,.22);
  border-radius:50%;
  opacity:.8;
  z-index:1;
}

.render-frame:after{
  content:"";
  position:absolute;
  inset:7% 8% 11%;
  background:
    radial-gradient(circle at 50% 46%, rgba(246,243,250,.16), transparent 42%),
    linear-gradient(180deg, rgba(246,243,250,.04), rgba(0,0,0,.08));
  border-radius:34px;
  filter:blur(18px);
  opacity:.62;
  z-index:0;
}

.render-video{
  position:relative;
  z-index:2;
  width:100%;
  max-height:620px;
  object-fit:contain;
  mix-blend-mode:screen;
  opacity:.92;
  filter:grayscale(1) contrast(1.08) brightness(.92);
  border:0;
  background:transparent;
}

.poster-fallback{
  position:relative;
  z-index:2;
  width:100%;
  max-height:620px;
  object-fit:contain;
  filter:grayscale(1) contrast(1.08) brightness(.92);
  opacity:.92;
  display:none;
}


/* Static lightweight render replacement for GitHub Pages */
.render-frame{
  position:relative;
  width:min(680px,100%);
  aspect-ratio:16/10;
  display:grid;
  place-items:center;
  filter:drop-shadow(0 30px 34px rgba(0,0,0,.45));
}

.render-frame:before{
  content:"";
  position:absolute;
  left:50%;
  bottom:4%;
  width:78%;
  height:30%;
  transform:translateX(-50%);
  border:1px solid rgba(246,243,250,.22);
  border-radius:50%;
  opacity:.72;
  z-index:1;
}

.render-frame:after{
  content:"";
  position:absolute;
  inset:8% 2% 8%;
  background:
    radial-gradient(circle at 50% 45%, rgba(246,243,250,.18), transparent 44%),
    radial-gradient(circle at 50% 80%, rgba(246,243,250,.08), transparent 42%);
  border-radius:34px;
  filter:blur(20px);
  opacity:.62;
  z-index:0;
}

.prosthetic-render{
  position:relative;
  z-index:2;
  width:112%;
  max-width:760px;
  object-fit:contain;
  filter:grayscale(1) contrast(1.08) brightness(.94);
  transform-origin:center center;
  animation:slowFloat 8s ease-in-out infinite;
}

@keyframes slowFloat{
  0%,100%{ transform:translateY(0) rotate(-1.2deg) scale(1); }
  50%{ transform:translateY(-10px) rotate(1.2deg) scale(1.018); }
}

.render-video,
.poster-fallback{
  display:none!important;
}

.video-caption{
  position:relative;
  z-index:5;
  margin-top:18px;
  color:var(--muted);
  font-size:13px;
  letter-spacing:.08em;
  text-transform:lowercase;
  text-align:center;
}

.cube-icon{
  display:block;
  margin:0 auto 9px;
  width:24px;
  height:24px;
  opacity:.82;
}

.casimir-note{
  margin-top:12px;
  color:var(--quiet);
  font-size:11px;
  letter-spacing:.06em;
  text-transform:lowercase;
}

.right-panel{
  border-left:1px solid var(--line);
  padding:42px 24px 42px 42px;
}

.status-title{
  font-size:16px;
  letter-spacing:.08em;
  text-transform:lowercase;
  margin-bottom:24px;
}

.tile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:44px;
}

.status-tile{
  min-height:142px;
  border:1px solid var(--line-strong);
  background:rgba(246,243,250,.025);
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.tile-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  color:var(--muted);
  font-size:13px;
  text-transform:lowercase;
}

.tile-value{
  font-family:"Inter", Arial, sans-serif;
  font-size:21px;
  line-height:1.12;
  letter-spacing:.01em;
  color:var(--ink);
}

.dot-icon{
  width:22px;
  height:22px;
  opacity:.7;
}

.status-block{
  border-top:1px solid var(--line);
  padding:32px 0 28px;
}

.status-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--ink);
  font-size:16px;
  letter-spacing:.06em;
  text-transform:lowercase;
}

.circle{
  width:18px;
  height:18px;
  border-radius:50%;
  border:1px solid var(--line-strong);
}

.status-desc{
  margin:24px 0 0;
  font-family:"Inter", Arial, sans-serif;
  font-size:18px;
  line-height:1.35;
  color:var(--ink);
}

.progress{
  margin-top:24px;
  width:100%;
  height:1px;
  background:var(--line);
  position:relative;
}

.progress:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  height:2px;
  width:26%;
  background:var(--ink);
}

.progress.short:before{
  width:23%;
}

@media(max-width:1050px){
  .dashboard{
    min-height:auto;
    padding:28px 20px;
  }

  .layout{
    grid-template-columns:1fr;
    margin-top:60px;
    gap:24px;
  }

  .left-panel,
  .right-panel{
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
  }

  .side-nav{
    display:grid;
    grid-template-columns:repeat(2,1fr);
  }

  .center-stage{
    min-height:auto;
  }

  .topbar{
    grid-template-columns:1fr;
  }

  .top-center,
  .top-year{
    justify-self:start;
  }
}

@media(max-width:620px){
  .side-nav,
  .tile-grid{
    grid-template-columns:1fr;
  }

  .brand{
    gap:14px;
    font-size:15px;
  }

  .brand .sub{
    font-size:12px;
  }
}
</style>
</head>

<body>
<main class="dashboard">
  <header class="topbar">
    <div class="brand">
      <span>ULF</span>
      <span class="divider"></span>
      <span class="sub">r&d dashboard</span>
    </div>

    <div class="top-center">year 1</div>
    <div class="top-year">2026</div>
  </header>

  <section class="layout">
    <aside class="left-panel">
      <div class="panel-title">details</div>

      <nav class="side-nav" aria-label="R&D dashboard navigation">
        <button class="nav-item active" type="button">
          <span class="nav-icon">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="14"></circle>
              <circle cx="20" cy="20" r="6"></circle>
              <path d="M20 2v8M20 30v8M2 20h8M30 20h8"></path>
            </svg>
          </span>
          <span class="nav-label">goal</span>
        </button>

        <button class="nav-item" type="button">
          <span class="nav-icon">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="14" cy="14" r="5"></circle>
              <circle cx="27" cy="15" r="5"></circle>
              <path d="M5 33c1-8 6-12 12-12s11 4 12 12"></path>
              <path d="M19 33c1-6 5-9 10-9 4 0 7 2 9 7"></path>
            </svg>
          </span>
          <span class="nav-label">team</span>
        </button>

        <button class="nav-item" type="button">
          <span class="nav-icon">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="15"></circle>
              <path d="M20 9v12l8 4"></path>
            </svg>
          </span>
          <span class="nav-label">timeline</span>
        </button>

        <button class="nav-item" type="button">
          <span class="nav-icon">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M11 5h13l6 6v24H11z"></path>
              <path d="M24 5v7h7M15 20h13M15 26h13"></path>
            </svg>
          </span>
          <span class="nav-label">files</span>
        </button>
      </nav>
    </aside>

    <section class="center-stage" aria-label="Simulation render preview">
      <div class="render-frame">
        <picture>
          <source srcset="ulf-prosthetic-render.webp" type="image/webp">
          <img class="prosthetic-render" src="ulf-prosthetic-render.png" alt="3D render of the Universal Limbs prosthetic hand simulation">
        </picture>
      </div>

      <div class="video-caption">
        <svg class="cube-icon" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M18 3l13 7.5v15L18 33 5 25.5v-15L18 3z" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 10.5L18 18l13-7.5M18 18v15" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        simulation preview
        <div class="casimir-note">simulation by former engineer Casimir</div>
      </div>
    </section>

    <aside class="right-panel">
      <div class="status-title">in progress</div>

      <div class="tile-grid">
        <div class="status-tile">
          <div class="tile-top">
            <span>task</span>
            <svg class="dot-icon" viewBox="0 0 24 24" aria-hidden="true">
              <g fill="currentColor">
                <circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/>
                <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
                <circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/>
              </g>
            </svg>
          </div>
          <div class="tile-value">design<br>review</div>
        </div>

        <div class="status-tile">
          <div class="tile-top">
            <span>team</span>
            <svg class="dot-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm8 9v-2a6 6 0 0 0-12 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M17 10a3 3 0 1 0-1-5.8M20 20v-1.5a5 5 0 0 0-4-4.9" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="tile-value">mechanical<br>systems</div>
        </div>
      </div>

      <div class="status-block">
        <div class="status-line">
          <span>pending</span>
          <span class="circle"></span>
        </div>
        <div class="status-desc">material approval</div>
        <div class="progress"></div>
      </div>

      <div class="status-block">
        <div class="status-line">
          <span>assist</span>
          <span class="circle"></span>
        </div>
        <div class="status-desc">simulation support</div>
        <div class="progress short"></div>
      </div>
    </aside>
  </section>
</main>

<script>
/*
  IMAGE SETUP FOR GITHUB / GOOGLE SITES

  Upload these files beside this HTML file:
  - ulf-prosthetic-render.webp
  - ulf-prosthetic-render.png

  The WebP is very small and loads first. PNG is the fallback.
  This avoids GitHub's 25MB upload limit for the MP4 video.
*/
</script>
</body>
</html>
